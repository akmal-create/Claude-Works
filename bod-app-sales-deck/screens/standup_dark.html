<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><style>
  :root{

  }
  :root[data-theme="light"]{ --bg:#eef2f6; --surface:#fff; --surface-2:#f2f5f9; --elev:#fff; --border:#dfe5ec; --ink:#16202a; --ink-2:#516070; --ink-3:#8794a2; --track:#e6ebf1; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:radial-gradient(120% 55% at 12% 0%, rgba(184,230,46,.06), transparent 55%), var(--bg);
    color:var(--ink); font-family:Manrope,sans-serif;
    -webkit-font-smoothing:antialiased; padding:24px 16px 40px; }
  .rc1{stroke-width:4.91px}.rc1,.rc2,.rc3,.rc4,.rc5,.rc6,.rc7,.rc8{fill:none}.rc1,.rc2,.rc3,.rc4,.rc5,.rc6,.rc7,.rc8,.rc9{stroke-miterlimit:10}.rc1,.rc3,.rc4,.rc7,.rc8{stroke:#fff200}.rc1,.rc6{opacity:.9}.rc2,.rc5,.rc6{stroke-width:.91px}.rc2,.rc5,.rc6,.rc9{stroke:#440e1e}.rc2,.rc8{opacity:.4}.rc3{stroke-width:10.87px}.rc4{stroke-linecap:round;stroke-width:28.47px}.rc5,.rc7{opacity:.25}.rc11{fill:#4424ff}.rc12{fill:#fff}.rc13,.rc9{fill:#440e1e}.rc7{stroke-width:5.5px}.rc8{stroke-width:5.14px}.rc9{stroke-width:1.07px}.rc14{fill:#fff200}

  .lead{ max-width:720px; margin:0 auto 24px; color:var(--ink-2); font-size:13.5px; line-height:1.55; text-align:center; }
  .lead b{ color:var(--ink); }
  .flow{ display:flex; gap:30px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  .col{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  .cap{ font-size:12px; color:var(--ink-3); font-weight:600; text-align:center; max-width:300px; }

  .phone{ width:320px; background:#000; border-radius:44px; padding:9px; box-shadow:0 40px 90px -34px rgba(0,0,0,.85); }
  .screen{ position:relative; background:var(--bg); border-radius:36px; overflow:hidden; height:660px; display:flex; flex-direction:column; }
  .island{ position:absolute; top:8px; left:50%; transform:translateX(-50%); width:100px; height:27px; background:#000; border-radius:16px; z-index:40; }
  .sb{ flex:0 0 auto; height:42px; display:flex; align-items:center; justify-content:space-between; padding:9px 20px 0; font-size:13px; font-weight:600; }
  .scroll{ flex:1 1 auto; overflow:hidden; padding:2px 16px 16px; }
  .top{ display:flex; align-items:center; gap:11px; height:44px; }
  .rnd{ width:36px; height:36px; border-radius:50%; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--ink-2); }
  .top h1{ margin:0; font-size:17px; font-weight:800; }

  /* shared card */
  .card{ border-radius:16px; border:1px solid var(--border); background:var(--surface); padding:15px; margin-top:14px; }
  .chd{ display:flex; align-items:center; gap:12px; }
  .chd .k{ font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); }
  .chd .h{ font-size:14.5px; font-weight:800; margin-top:2px; }
  .chd .x{ margin-left:auto; color:var(--ink-3); font-size:15px; align-self:flex-start; }

  /* nudge — decluttered */
  .quote{ margin-top:12px; padding-left:12px; border-left:2px solid var(--waiting); font-size:12.5px; line-height:1.5; color:var(--ink-2); }
  .quote b{ color:var(--ink); }
  .acts{ display:flex; gap:8px; margin-top:14px; }
  .btn{ height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:12.5px; font-weight:800; }

  /* standup — decluttered to summary rows */

  .grow:first-of-type{ border-top:0; margin-top:6px; }
  .grow .ge{ font-size:16px; width:22px; text-align:center; flex:0 0 auto; }
  .grow .gl{ font-size:13px; font-weight:700; } .grow .gs{ font-size:11px; color:var(--ink-3); margin-top:2px; }
  .grow .gc{ margin-left:auto; font-size:15px; font-weight:800; }
  .grow.done .gc{ color:var(--green) } .grow.blk .gc{ color:var(--blocked) } .grow.due .gc{ color:var(--blue) }
  .copy{ height:44px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px; }

  /* inline banner on task */
  .tdcard{ border-radius:16px; background:var(--surface); border:1px solid var(--border); padding:14px; margin-top:14px; }
  .tdcard h2{ margin:0 0 6px; font-size:16px; font-weight:800; } .tdcard .cl{ font-size:12px; color:var(--waiting); font-weight:700; }
  .tdrow{ display:flex; justify-content:space-between; padding:12px 2px; border-bottom:1px solid var(--border); font-size:12.5px; }
  .tdrow .k{ color:var(--ink-3) } .tdrow .v{ font-weight:700 }
  .inline{ display:flex; gap:11px; align-items:center; border-radius:14px; background:var(--waiting-s); border:1px solid rgba(242,201,76,.35); padding:12px; margin-top:14px; }
  .inline .tx{ font-size:12.5px; color:var(--ink); line-height:1.4; } .inline .tx b{ color:var(--waiting); }
  .miniacts{ display:flex; gap:14px; margin-top:8px; } .miniacts .m{ font-size:11.5px; font-weight:800; color:var(--waiting); } .miniacts .m.d{ color:var(--ink-3) }
  .mono{ font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--ink-3); text-align:center; margin-top:16px }

  /* group chat standup surface */
  .gc .msg{ display:flex; gap:9px; margin-top:14px; }
  .gc .av{ width:30px; height:30px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#0B0D0C; }
  .gc .bub{ background:var(--surface); border:1px solid var(--border); border-radius:14px; border-top-left-radius:5px; padding:9px 11px; }
  .gc .who{ font-size:10.5px; font-weight:800; color:var(--ink-2); margin-bottom:3px; }
  .gc .tx{ font-size:12.5px; color:var(--ink); line-height:1.4; }
  .gc .standup{ background:var(--elev); border:1px solid rgba(91,140,240,.35); border-radius:14px; padding:13px; margin-top:14px; }
  .gc .sh{ display:flex; align-items:center; gap:9px; font-size:11px; font-weight:800; color:var(--blue); }
  .gc .li2{ display:flex; gap:7px; font-size:12px; margin-top:9px; color:var(--ink); }
  .gc .li2 b{ color:var(--ink-2); font-weight:700; }
  .gc .postbtn{ height:46px; border-radius:12px; background:var(--lime); color:var(--lime-ink); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; }
